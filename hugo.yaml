baseURL: https://chuxubank.github.io/
defaultContentLanguage: zh
title: Misaka's Blog
timeZone: Asia/Shanghai

pagination:
  pagerSize: 5

caches:
  images:
    dir: :cacheDir/images

markup:
  highlight:
    noClasses: false

module:
  imports:
    - path: github.com/panr/hugo-theme-terminal/v4

params:
  contentTypeName: posts
  themeColor: orange
  showMenuItems: 2
  showLanguageSelector: true
  fullWidthTheme: false
  centerTheme: true
  autoCover: true
  showLastUpdated: true
  enableGitInfo: true
  readingTime: true
  Toc: true
  twitter:
    creator: chuxubank
    site: ""

languages:
  en:
    languageName: English
    title: InitSeq
    params:
      subtitle: Listen to bothsides and you will be enlightened; heed only one side and you will be benighted.
      owner: X.Chuu
      keywords: ""
      copyright: chuxubank
      menuMore: Show more
      readMore: Read more
      readOtherPosts: Read other posts
      newerPosts: Newer posts
      olderPosts: Older posts
      missingContentMessage: Page not found...
      missingBackButtonLabel: Back to home page
      minuteReadingTime: min read
      words: words
      logo:
        logoText: InitSeq
        logoHomeLink: /
    menu:
      main:
        - identifier: about
          name: About
          url: /about
        - identifier: showcase
          name: Showcase
          url: /showcase
  zh:
    languageName: 中文
    title: 初序
    params:
      subtitle: 兼听则明，偏信则暗
      owner: 旭
      keywords: ""
      copyright: 旭
      menuMore: 更多
      readMore: 阅读更多
      readOtherPosts: 阅读其他
      newerPosts: 新
      olderPosts: 旧
      missingContentMessage: 无序之处...
      missingBackButtonLabel: 回家
      minuteReadingTime: 分钟
      words: 字
      logo:
        logoText: 初序
        logoHomeLink: /
    menu:
      main:
        - identifier: about
          name: 关于
          url: /about
        - identifier: showcase
          name: 展示
          url: /showcase
