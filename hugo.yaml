baseURL: https://chuxubank.github.io/
languageCode: en-us
title: Misaka's Blog

pagination:
  pagerSize: 5

caches:
  images:
    dir: :cacheDir/images

markup:
  highlight:
    noClasses: false

module:
  imports:
    - path: github.com/panr/hugo-theme-terminal/v4

params:
  contentTypeName: posts
  themeColor: orange
  showMenuItems: 2
  showLanguageSelector: true
  fullWidthTheme: false
  centerTheme: true
  autoCover: true
  showLastUpdated: true
  enableGitInfo: true
  readingTime: true
  Toc: true
  twitter:
    creator: chuxubank
    site: ""

languages:
  en:
    languageName: English
    title: Misaka's Blog
    subtitle:
      Listen to bothsides and you will be enlightened; heed only one side
      and you will be benighted.
    owner: chuxubank
    keywords: ""
    copyright: chuxubank
    menuMore: Show more
    readMore: Read more
    readOtherPosts: Read other posts
    missingContentMessage: Page not found...
    missingBackButtonLabel: Back to home page
    params:
      logo:
        logoText: Misaka
        logoHomeLink: /
    menu:
      main:
        - identifier: about
          name: About
          url: /about
        - identifier: showcase
          name: Showcase
          url: /showcase
  zh:
    languageName: Chinese
    title: 旭艺阁
    subtitle: 兼听则明，偏信则暗
    owner: 旭
    keywords: ""
    copyright: chuxubank
    menuMore: 更多
    readMore: 阅读更多
    readOtherPosts: 阅读其他
    missingContentMessage: 荒芜之地...
    missingBackButtonLabel: 回家
    params:
      logo:
        logoText: Misaka
        logoHomeLink: /
    menu:
      main:
        - identifier: about
          name: 关于
          url: /about
        - identifier: showcase
          name: 展示
          url: /showcase
